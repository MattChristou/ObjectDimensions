name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # msbuild and dumpbin on PATH
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build plugin (Release x64)
        run: msbuild ObjectDimensions.vcxproj /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$env:GITHUB_WORKSPACE\

      - name: Check exports (_mod_descrip, lwf_plugin_info)
        shell: pwsh
        run: |
          $ex = dumpbin /exports bin/Release/ObjectDimensions.p | Out-String
          foreach ($s in '_mod_descrip', 'lwf_plugin_info') {
            if ($ex -notmatch [regex]::Escape($s)) { Write-Error "$s is not exported"; exit 1 }
          }
          Write-Host "exports ok"

      - uses: actions/upload-artifact@v4
        with:
          name: ObjectDimensions-windows
          path: bin/Release/ObjectDimensions.p

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta (to run the x86_64 slice)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build plugin + checks (universal arm64/x86_64)
        run: sh build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ObjectDimensions-mac
          path: build/mac/ObjectDimensions-mac.zip
